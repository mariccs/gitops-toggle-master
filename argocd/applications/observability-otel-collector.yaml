apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    # Sobe depois do Prometheus/Loki (wave -2) e junto com o "shared" dos
    # microsserviços (wave -1), para já existir quando os 5 serviços
    # começarem a exportar telemetria via OTLP.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.148.0"
      helm:
        valueFiles:
          - $values/observability/otel-collector/values.yaml
    - repoURL: https://github.com/mariccs/gitops-toggle-master.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
