apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/<seu-usuario>/toggle-master-gitops.git
    targetRevision: main
    path: shared
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
