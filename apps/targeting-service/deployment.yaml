apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 499743054252.dkr.ecr.us-east-1.amazonaws.com/targeting-service:v1.0.0-5e18583
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: TARGETING_SERVICE_PORT
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: AUTH_SERVICE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: targeting-service-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
