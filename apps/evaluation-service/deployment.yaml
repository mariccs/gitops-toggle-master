apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service-sa
      containers:
      - name: evaluation-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/evaluation-service:v1.0.0-5e18583
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: EVALUATION_SERVICE_PORT
        - name: FLAG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: FLAG_SERVICE_URL
        - name: TARGETING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: TARGETING_SERVICE_URL
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: AWS_REGION
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: evaluation-service-secrets
              key: REDIS_URL
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: evaluation-service-secrets
              key: SERVICE_API_KEY
        - name: AWS_SQS_URL
          valueFrom:
            secretKeyRef:
              name: evaluation-service-secrets
              key: AWS_SQS_URL
        resources:
          requests:
            cpu: 150m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
