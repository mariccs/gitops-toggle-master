apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-grafana-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "title": "ToggleMaster - Visão Geral (Fase 4)",
      "uid": "togglemaster-overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "tags": ["togglemaster", "fase4", "observabilidade"],
      "panels": [
        {
          "id": 1,
          "title": "Uso de CPU por pod (namespace togglemaster)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Uso de memória por pod (namespace togglemaster)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Taxa de requisições por microsserviço (RED - spanmetrics)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
              "expr": "sum(rate(calls_total[1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Taxa de erro (5xx / status de erro) por microsserviço",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
              "expr": "sum(rate(calls_total{status_code=\"STATUS_CODE_ERROR\"}[5m])) by (service_name) / sum(rate(calls_total[5m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Latência p95 por microsserviço",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-tm" },
              "expr": "histogram_quantile(0.95, sum(rate(duration_bucket[5m])) by (service_name, le))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Logs em tempo real - togglemaster",
          "type": "logs",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki-tm" },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki-tm" },
              "expr": "{service_namespace=\"togglemaster\"}"
            }
          ]
        }
      ]
    }
